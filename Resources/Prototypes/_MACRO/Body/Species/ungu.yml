#[x] MarkingsGroup
#[x] AppearanceSpecies, modified from Body/Prototypes/species.yml
#[x] MobSpecies, modified from Entities/Mobs/Species/species.yml
#[] External organs (formerly ‘parts’), modified from Body/Organs/species.yml
#[] Internal organs, modified from Body/Parts/species.yml

- type: markingsGroup
  id: Ungu
  onlyWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Arms:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Legs:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Eyes:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceUngu
  name: ungu appearance
  components:
