    displacements:
      gloves:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: hands
      belt:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: belt
      back:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: ears
      head:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: mask
      neck:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: neck
      shoes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: shoes
      eyes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: eyes
      outerClothing:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: outerwear
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
            state: jumpsuit
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
          state: inhand_left
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _MACRO/Mobs/Species/Ungu/displacement.rsi
          state: inhand_right

  - type: InitialBody
    organs:
      Torso: OrganUnguTorso
      Head: OrganUnguHead
      ArmLeft: OrganUnguArmLeft
      ArmRight: OrganUnguArmRight
      HandLeft: OrganUnguHandLeft
      HandRight: OrganUnguHandRight
      LegLeft: OrganUnguLegLeft
      LegRight: OrganUnguLegRight
      FootLeft: OrganUnguFootLeft
      FootRight: OrganUnguFootRight
      Brain: OrganUnguBrain
      Eyes: OrganUnguEyes
      Tongue: OrganUnguTongue
      Appendix: OrganUnguAppendix
      Ears: OrganUnguEars
      Lungs: OrganUnguLungs
      Heart: OrganUnguHeart
      Stomach: OrganUnguStomach
      Liver: OrganUnguLiver
      Kidneys: OrganUnguKidneys

  - type: HumanoidProfile
    species: Ungu

- type: entity
  parent:
  - AppearanceUngu
  - BaseSpeciesMobOrganic
  id: MobUngu
  name: Urist McHooves
  components:
  - type: CowToolProficiency
  - type: Pullable
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.7
  - type: CombatModeSprint
    stunSeconds: 1
    doImpactDamage: true
    beginCombatMessage: "ungu-begin-combat-popup"
  - type: CombatMode
  - type: CombatModeVisuals
    hideBaseLayer: true
  - type: MeleeWeapon
    attackRate: 0.6
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 8
        Structural: 12
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 12
        Structural: 20
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      200: Dead
  - type: StaminaDamageOnHit
    damage: 18
  - type: Hunger
    thresholds:
      Overfed: 150
      Okay: 100
      Peckish: 50
      Starving: 25
      Dead: 0
    baseDecayRate: 0.0124 # 3/4 as fast as a human
  - type: Thirst
  - type: Icon
    sprite: _Impstation/Mobs/Species/Ungu/parts.rsi
    state: full
  - type: Body
    prototype: Ungu
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300 #STOP! BEING! 500!!!
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    sounds:
      Male: UnisexUngu
      Female: UnisexUngu
      Unsexed: UnisexUngu
  - type: BodyEmotes
    soundsId: UnguBodyEmotes
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Ungu
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 200
    coldDamage:
      types:
        Cold: 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 3.0 #per second, scales with temperature & other constants
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/ungu_brute_damage.rsi
        color: "#ff624a"
  - type: Speech
    speechSounds: Ungu
    allowedEmotes: ['Moo']
  - type: TypingIndicator
    proto: Ungu
  - type: HumanoidAppearance
    species: Ungu
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
    - SnoutCover
    - LFoot # those are his hooves you bitch
    - RFoot
  - type: JumpAbility
    action: ActionDash
    jumpDistance: 4
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: .5
        volume: -3
        variation: 0.05